<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 28" preserveAspectRatio="none">
  <defs>
    <filter id="glow" x="-2%" y="-80%" width="104%" height="260%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Main trace: left→right, zigzagging between y=7 / y=14 / y=21 -->
  <path d="
    M 0,14
    L 110,14 L 117,7  L 210,7  L 217,14
    L 310,14 L 317,21 L 400,21 L 407,14
    L 560,14 L 567,7  L 690,7  L 697,14
    L 790,14 L 797,21 L 880,21 L 887,14
    L 1060,14 L 1067,7  L 1160,7  L 1167,14
    L 1280,14 L 1287,21 L 1390,21 L 1397,14
    L 1560,14 L 1567,7  L 1710,7  L 1717,14
    L 1820,14 L 1827,21 L 1920,21"
    stroke="rgba(160,32,240,0.65)" stroke-width="1.2" fill="none"
    stroke-linecap="square" stroke-linejoin="miter"
    filter="url(#glow)"/>

  <!-- Secondary trace running along top edge with a few dips -->
  <path d="
    M 0,7
    L 70,7  L 77,14 L 110,14
    M 1710,7 L 1760,7 L 1767,14 L 1820,14 L 1827,7 L 1920,7"
    stroke="rgba(160,32,240,0.38)" stroke-width="0.9" fill="none"
    stroke-linecap="square"/>

  <!-- Secondary trace running along bottom edge -->
  <path d="
    M 0,21
    L 55,21 L 62,14 L 110,14
    M 1390,21 L 1430,21 L 1437,14 L 1480,14 L 1487,21 L 1560,21 L 1567,14"
    stroke="rgba(160,32,240,0.35)" stroke-width="0.9" fill="none"
    stroke-linecap="square"/>

  <!-- Branch stubs off main trace -->
  <path d="M 407,14 L 440,14 L 447,7  L 490,7"
    stroke="rgba(160,32,240,0.42)" stroke-width="0.8" fill="none" stroke-linecap="square"/>
  <path d="M 697,14 L 720,14 L 727,21 L 760,21"
    stroke="rgba(160,32,240,0.38)" stroke-width="0.8" fill="none" stroke-linecap="square"/>
  <path d="M 887,14 L 920,7  L 960,7"
    stroke="rgba(160,32,240,0.38)" stroke-width="0.8" fill="none" stroke-linecap="square"/>
  <path d="M 1167,14 L 1200,7 L 1240,7"
    stroke="rgba(160,32,240,0.38)" stroke-width="0.8" fill="none" stroke-linecap="square"/>
  <path d="M 1397,14 L 1430,21 L 1500,21 L 1507,14 L 1540,14"
    stroke="rgba(160,32,240,0.35)" stroke-width="0.8" fill="none" stroke-linecap="square"/>
  <path d="M 1717,14 L 1745,14 L 1752,21 L 1790,21"
    stroke="rgba(160,32,240,0.38)" stroke-width="0.8" fill="none" stroke-linecap="square"/>

  <!-- Vias (dots at junctions and branch points) -->
  <circle cx="117"  cy="7"  r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="217"  cy="14" r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="317"  cy="21" r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="407"  cy="14" r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="447"  cy="7"  r="1.6" fill="rgba(160,32,240,0.7)"/>
  <circle cx="567"  cy="7"  r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="697"  cy="14" r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="727"  cy="21" r="1.6" fill="rgba(160,32,240,0.7)"/>
  <circle cx="797"  cy="21" r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="887"  cy="14" r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="920"  cy="7"  r="1.6" fill="rgba(160,32,240,0.7)"/>
  <circle cx="1067" cy="7"  r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="1167" cy="14" r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="1200" cy="7"  r="1.6" fill="rgba(160,32,240,0.7)"/>
  <circle cx="1287" cy="21" r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="1397" cy="14" r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="1507" cy="14" r="1.6" fill="rgba(160,32,240,0.7)"/>
  <circle cx="1567" cy="7"  r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="1717" cy="14" r="2.2" fill="rgba(160,32,240,0.85)"/>
  <circle cx="1752" cy="21" r="1.6" fill="rgba(160,32,240,0.7)"/>
  <circle cx="1827" cy="21" r="2.2" fill="rgba(160,32,240,0.85)"/>
</svg>
